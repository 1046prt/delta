name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ scripts/ tests/ --select E,F,W --ignore E501

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Test imports
        run: |
          python -c "from src.models.siamese_unet import SiameseUNet; print('SiameseUNet OK')"
          python -c "from src.models.unet import UNet, Autoencoder; print('UNet OK')"
          python -c "from src.training.losses import CombinedLoss; print('Losses OK')"
          python -c "from src.inference.predict import load_model, predict; print('Inference OK')"
