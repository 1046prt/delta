experiment:
  name: "siamese_unet_rgb_v2"
  seed: 42
  device: "auto"

data:
  root: "data/oscd100"
  batch_size: 4
  num_workers: 0

model:
  type: "siamese_unet"
  in_channels: 3
  out_channels: 1
  features: [64, 128, 256, 512]
  use_attention: true

loss:
  type: "focal_dice"
  focal_alpha: 0.75
  focal_gamma: 2.0
  alpha: 0.6

optimizer:
  type: "adam"
  lr: 0.0005
  weight_decay: 0.0001

scheduler:
  type: "cosine"
  T_0: 10
  T_mult: 2
  min_lr: 0.00001

training:
  max_epochs: 80
  early_stopping_patience: 15
  grad_clip: 1.0
  mixed_precision: false
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/metrics"
