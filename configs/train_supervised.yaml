experiment:
  name: "siamese_unet_rgb"
  seed: 42
  device: "auto"

data:
  root: "data/oscd100"
  batch_size: 4
  num_workers: 0

model:
  type: "siamese_unet"
  in_channels: 3
  out_channels: 1
  features: [64, 128, 256, 512]
  use_attention: true

loss:
  type: "combined"
  alpha: 0.5
  pos_weight: null
  smooth: 1.0

optimizer:
  type: "adam"
  lr: 0.001
  weight_decay: 0.0001

scheduler:
  type: "reduce_on_plateau"
  factor: 0.5
  patience: 5
  min_lr: 0.00001

training:
  max_epochs: 50
  early_stopping_patience: 10
  grad_clip: 1.0
  mixed_precision: false
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/metrics"
