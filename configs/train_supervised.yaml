experiment:
  name: "oscd_unet_rgb_ndvi"
  seed: 42
  device: "auto"

data:
  root: "data/oscd100"
  bands: ["B02", "B03", "B04", "B08"]  # RGB + NIR
  patch_size: 256
  batch_size: 8
  num_workers: 2
  use_ndvi: true
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

model:
  type: "siamese_unet"
  in_channels: 4   # RGB + NDVI per date
  out_channels: 1
  features: [64, 128, 256, 512]
  use_attention: true

loss:
  type: "combined"
  alpha: 0.5
  pos_weight: null  # auto-computed from class imbalance
  smooth: 1.0

optimizer:
  type: "adam"
  lr: 0.001
  weight_decay: 0.0001

scheduler:
  type: "reduce_on_plateau"
  factor: 0.5
  patience: 5
  min_lr: 0.00001

training:
  max_epochs: 100
  early_stopping_patience: 15
  grad_clip: 1.0
  mixed_precision: true
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/metrics"

evaluation:
  thresholds: [0.3, 0.5, 0.7]
  best_metric: "f1"
