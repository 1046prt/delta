experiment:
  name: "autoencoder_rgb"
  seed: 42
  device: "auto"

data:
  root: "data/oscd100"
  batch_size: 4
  num_workers: 0

model:
  type: "autoencoder"
  in_channels: 3
  features: [64, 128, 256, 512]

optimizer:
  type: "adam"
  lr: 0.001
  weight_decay: 0.0001

scheduler:
  type: "reduce_on_plateau"
  factor: 0.5
  patience: 5
  min_lr: 0.00001

training:
  max_epochs: 50
  early_stopping_patience: 10
  mixed_precision: false
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/metrics"

inference:
  change_threshold: 0.15
