experiment:
  name: "oscd_self_supervised"
  seed: 42
  device: "auto"

data:
  root: "data/oscd100"
  bands: ["B02", "B03", "B04", "B08"]
  patch_size: 256
  batch_size: 8
  num_workers: 2
  use_ndvi: true

model:
  type: "autoencoder"
  in_channels: 4
  features: [64, 128, 256, 512]

loss:
  type: "mse"

optimizer:
  type: "adam"
  lr: 0.001
  weight_decay: 0.0001

scheduler:
  type: "reduce_on_plateau"
  factor: 0.5
  patience: 5
  min_lr: 0.00001

training:
  max_epochs: 80
  early_stopping_patience: 15
  grad_clip: 1.0
  mixed_precision: true
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/metrics"

inference:
  change_threshold: 0.15
  gaussian_blur_sigma: 2.0
  min_change_area: 50  # minimum connected component size in pixels
